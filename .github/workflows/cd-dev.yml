name: CI/CD using github actions & docker

on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: Inspect backend versions and worker settings without deploying
        type: boolean
        default: false
      rollout_idle:
        description: Deploy the immutable wake-on-work image to dev, latest and stable (requires stage_only)
        type: boolean
        default: false
      stage_only:
        description: Build an immutable image without deploying
        type: boolean
        default: false
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  push_to_registry:
    if: ${{ !inputs.audit_only }}
    name: Push to aws container registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: make application-prod.yml
        if: inputs.stage_only || contains(github.ref, 'develop') || contains(github.ref, 'main')
        run: |
          cd ./src/main/resources
          touch ./application-prod.yml
          echo "${{ secrets.YML_PROD }}" > ./application-prod.yml
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        env:
          SPRING_PROFILES_ACTIVE: prod
        run: ./gradlew clean build --stacktrace
        shell: bash

      - name: Build immutable cutover image
        if: inputs.stage_only
        env:
          REGISTRY_USER: ${{ secrets.DOCKER_USER }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USER" --password-stdin
          docker build -t "$REGISTRY_USER/kodaero-app:neon-$GITHUB_SHA" -f ./Dockerfile .
          docker push "$REGISTRY_USER/kodaero-app:neon-$GITHUB_SHA"

      - name: Docker build & push to prod
        if: ${{ !inputs.stage_only && (contains(github.ref, 'develop') || contains(github.ref, 'main')) }}
        run: |
          docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t kodaero-dev -f ./Dockerfile .
          docker tag kodaero-dev:latest ${{ secrets.DOCKER_USER }}/kodaero-dev:latest
          docker push ${{ secrets.DOCKER_USER }}/kodaero-dev:latest
          
          
  pull_from_registry:
    if: ${{ !inputs.stage_only && !inputs.audit_only }}
    name: Connect server ssh and pull from container registry
    needs: push_to_registry
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to prod
        if: contains(github.ref, 'develop') || contains(github.ref, 'main')
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            docker pull ${{ secrets.DOCKER_USER }}/kodaero-dev:latest
            cd infra
            chmod +x ./deploy-dev.sh
            sudo ./deploy-dev.sh
            docker image prune -f

  audit_backends:
    if: ${{ inputs.audit_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed backends without printing credentials
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
            docker inspect app-dev app-latest app-stable | python3 -c '
            import json,sys
            allowed={"PUSH_STORAGE","PUSH_AUDIENCE","PUSH_WORKER_ENABLED","PUSH_RECEIPT_WORKER_ENABLED","PUSH_SURVEY_WORKER_ENABLED","PUSH_OUTBOX_ENABLED","PUSH_WORKER_FIXED_DELAY_MS","PUSH_RECEIPT_WORKER_FIXED_DELAY_MS","PUSH_SURVEY_POLL_INTERVAL_MS","PUSH_IDLE_NAMESPACE","PUSH_IDLE_RECONCILE_CRON","SERVER_PORT","SPRING_PROFILES_ACTIVE"}
            for c in json.load(sys.stdin):
                print(c["Name"], c["Config"]["Image"], c["Image"], c["State"]["Status"])
                print("ports", c["NetworkSettings"]["Ports"])
                print("network", c["HostConfig"]["NetworkMode"], "port arguments", [v for v in c["Config"].get("Cmd",[]) or [] if v.startswith("--server.port=")])
                print("compose files", c["Config"].get("Labels",{}).get("com.docker.compose.project.config_files"))
                print("worker settings", dict(v.split("=",1) for v in c["Config"]["Env"] if v.split("=",1)[0] in allowed))
                print("configuration mounts", [(m["Source"],m["Destination"]) for m in c.get("Mounts",[]) if "yml" in m["Destination"] or "yaml" in m["Destination"]])
            '
