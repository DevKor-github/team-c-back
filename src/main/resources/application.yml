spring:
  cache:
    type: redis
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        query:
          plan_cache_max_size: 512 # 캐시 크기 제한 (기본값이 너무 클 수 있음)
          plan_parameter_metadata_max_size: 128
      dialect: org.hibernate.dialect.MySQL8InnoDBDialect
    defer-datasource-initialization: true
    sql:
      init:
        mode: always
        encoding: UTF-8

  servlet:
    multipart:
      location: /tmp
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          # 핵심: true로 되어 있다면 false로 변경 (매 요청마다 PING 방지)
          test-on-borrow: false
          # 대신 연결이 유효한지 백그라운드에서 가끔 확인
          test-while-idle: true
          # 유효성 검사 주기 (예: 30초)
          time-between-eviction-runs: 30s

  mail:
    host: smtp.gmail.com
    port: 587
    username: leeyejin113@gmail.com
    password: ${EMAIL_PASSWORD}
    protocol: smtp
    tls: true
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

#  elasticsearch:
#    uris: ${ELASTIC_URIS}
#    username: ${ELASTIC_USERNAME}
#    password: ${ELASTIC_PASSWORD}

logging:
  level:
    org.hibernate.SQL: off
#    org.elasticsearch.client: TRACE

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  social:
    kakao:
      iss: ${KAKAO_ISS}
      aud: ${KAKAO_AUD}
    google:
      iss: ${GOOGLE_ISS}
      aud: ${GOOGLE_AUD}
    apple:
      iss: ${APPLE_ISS}
      aud: ${APPLE_AUD}
      dev-aud: ${APPLE_DEV_AUD}
  admin:
    token: ${JWT_ADMIN_TOKEN}

cloud:
  aws:
    s3:
      bucket: ${BUCKET_NAME}
    credentials:
      access-key: ${BUCKET_ACCESS_KEY}
      secret-key: ${BUCKET_SECRET_KEY}
    region:
      static: ap-northeast-2

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    path: /swagger-ui.html
    doc-expansion: none
    enabled: true
    display-request-duration: true
  paths-to-match:
    - /api/**

