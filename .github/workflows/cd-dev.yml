name: Push Neon cutover operations
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only deployment inventory
        required: true
        default: inventory
        type: choice
        options: [inventory]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Read server deployment metadata without secrets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -eu
            hostname
            docker ps --format '{{.Names}} {{.Image}} {{.Status}}'
            cd /home/yjlee/infra
            python3 - <<'PY'
            import json, subprocess, pathlib, re
            for name in ['app-dev','app-latest','app-stable']:
                result=subprocess.run(['docker','inspect',name],capture_output=True,text=True)
                if result.returncode: continue
                info=json.loads(result.stdout)[0]
                env=dict(item.split('=',1) for item in info['Config']['Env'] if '=' in item)
                print(json.dumps({'container':name,'imageId':info['Image'],'safePushSettings':{k:v for k,v in env.items() if re.match(r'^PUSH_(STORAGE|AUDIENCE|.*ENABLED|EVENT_TARGET_APP_VARIANTS)$',k)},'envKeys':sorted(env),'mounts':[{'source':m['Source'],'destination':m['Destination']} for m in info.get('Mounts',[])]}))
            for filename in ['deploy-dev.sh','deploy-prod.sh']:
                print('SCRIPT '+filename)
                print(pathlib.Path(filename).read_text())
            print('COMPOSE SERVICE NAMES')
            subprocess.run(['docker','compose','config','--services'],check=True)
            PY
