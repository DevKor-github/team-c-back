spring:
  cache:
    type: none
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: false
    sql:
      init:
        mode: never

  data:
    redis:
      host: localhost
      port: 6379
      password:

  mail:
    host: localhost
    port: 25
    username: test
    password: test

jwt:
  secret:
    key: test-jwt-secret-key-for-testing-purposes-only-must-be-at-least-256-bits
  social:
    kakao:
      iss: test
      aud: test
    google:
      iss: test
      aud: test
    apple:
      iss: test
      aud: test
      dev-aud: test
  admin:
    token: test-admin-token

cloud:
  aws:
    s3:
      bucket: test-bucket
    credentials:
      access-key: test
      secret-key: test
    region:
      static: ap-northeast-2

profile:
  image:
    lv1-url: http://localhost/profile/lv1.jpg
    lv2-url: http://localhost/profile/lv2.jpg
    lv3-url: http://localhost/profile/lv3.jpg
    lv4-url: http://localhost/profile/lv4.jpg
    lv5-url: http://localhost/profile/lv5.jpg

place:
  default-image:
    cafe: http://localhost/place/CAFE.jpg
    cafeteria: http://localhost/place/CAFETERIA.jpg
    convenience-store: http://localhost/place/CONVENIENCE_STORE.jpg
    gym: http://localhost/place/GYM.jpg
    lounge: http://localhost/place/LOUNGE.jpg
    reading-room: http://localhost/place/READING_ROOM.jpg
    shower-room: http://localhost/place/SHOWER_ROOM.jpg
    sleeping-room: http://localhost/place/SLEEPING_ROOM.jpg
    study-room: http://localhost/place/STUDY_ROOM.jpg

date:
  api:
    holiday:
      end-point: http://localhost/api/holiday
      encoded-key: test
      decoded-key: test

metrics:
  environment: test

management:
  endpoints:
    web:
      exposure:
        include: health

staff:
  emails: test@test.com
